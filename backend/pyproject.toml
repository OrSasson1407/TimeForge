[project]
name = "timeforge-backend"
version = "0.1.0"
description = "TimeForge backend: FastAPI API, domain model, and constraint-based scheduling engine."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "firebase-admin>=6.6",
    "python-dotenv>=1.0",
    "tzdata>=2024.2",
    "cryptography>=43.0",
    "email-validator>=2.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
    "pyright>=1.1.384",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "N", "SIM"]
ignore = ["S101"]  # allow assert (used in tests)

[tool.ruff.lint.flake8-bugbear]
# FastAPI's own dependency-injection idiom: `param: T = Depends(...)` (and
# Query/Header) is a call in a default, which B008 would otherwise flag —
# it's evaluated once per request by FastAPI itself, not a mutable-default
# bug (the case B008 exists to catch).
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header", "fastapi.Path", "fastapi.Body"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"scripts/**" = ["S311"]  # non-cryptographic random is fine for synthetic demo/benchmark data

[tool.pyright]
include = ["app", "tests", "scripts"]
pythonVersion = "3.12"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-m 'not slow'"
markers = [
    "slow: full-scale scheduling integration tests (tens of seconds) — run explicitly with `-m slow`",
]
